name: Arti Binary Provenance

# The Arti xcframework is a vendored binary; these checks turn the policy in
# docs/ARTI-BINARY-PROVENANCE.md into an enforced gate:
#  1. The checked-in binary must match the hash manifest in the provenance doc.
#  2. Reviewed source and build inputs must match their audited hashes.
#  3. A PR that changes the binary must also change at least one provenance
#     input (Rust source, lockfile, build script, or the doc itself).

on:
  push:
    branches:
      - main
    paths:
      - "localPackages/Arti/**"
      - "docs/ARTI-BINARY-PROVENANCE.md"
      - ".github/workflows/arti-provenance.yml"
      - "scripts/tests/test_arti_archive_normalization.py"
  pull_request:
    paths:
      - "localPackages/Arti/**"
      - "docs/ARTI-BINARY-PROVENANCE.md"
      - ".github/workflows/arti-provenance.yml"
      - "scripts/tests/test_arti_archive_normalization.py"

permissions:
  contents: read

jobs:
  verify-hashes:
    name: Verify xcframework hashes against provenance doc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare artifact hashes with manifest
        run: |
          set -euo pipefail
          doc="docs/ARTI-BINARY-PROVENANCE.md"

          # Extract the manifest: lines of "<sha256>  <path>" from the doc.
          grep -E '^[0-9a-f]{64}  localPackages/Arti/Frameworks/arti\.xcframework/' "$doc" \
            | sort -k2 > expected.txt

          if [ ! -s expected.txt ]; then
            echo "::error::No hash manifest found in $doc"
            exit 1
          fi

          # Hash the same file set the doc documents.
          find localPackages/Arti/Frameworks/arti.xcframework -maxdepth 3 -type f -print0 \
            | sort -z | xargs -0 sha256sum | sed 's/  \.\//  /' | sort -k2 > actual.txt

          if ! diff -u expected.txt actual.txt; then
            echo "::error::Checked-in arti.xcframework does not match the manifest in $doc. If the binary change is intentional, rebuild per the doc and update the manifest in the same PR."
            exit 1
          fi
          echo "All $(wc -l < actual.txt) artifact hashes match the provenance manifest."

  verify-source-inputs:
    name: Verify native source and recipe hashes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare reviewed source inputs with manifest
        run: |
          set -euo pipefail
          doc="docs/ARTI-BINARY-PROVENANCE.md"
          grep -E '^[0-9a-f]{64}  localPackages/Arti/(Cargo\.(toml|lock)|build-ios\.sh|normalize-archive\.py|arti-bitchat/)' "$doc" \
            | sort -k2 > expected-inputs.txt
          test -s expected-inputs.txt
          git ls-files -z -- localPackages/Arti/Cargo.toml localPackages/Arti/Cargo.lock \
            localPackages/Arti/build-ios.sh localPackages/Arti/normalize-archive.py localPackages/Arti/arti-bitchat \
            | sort -z | xargs -0 sha256sum | sort -k2 > actual-inputs.txt
          if ! diff -u expected-inputs.txt actual-inputs.txt; then
            echo "::error::Arti source or recipe changed without an updated audited build record. Rebuild and review the source/artifact pair, or document and review why the change cannot affect the shipped library."
            exit 1
          fi

      - name: Check archive padding contracts
        run: python3 -m unittest discover -s scripts/tests -p test_arti_archive_normalization.py

  require-provenance-evidence:
    name: Binary changes must ship with provenance inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check changed files
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"
          echo "$changed"

          if ! echo "$changed" | grep -q '^localPackages/Arti/Frameworks/arti\.xcframework/'; then
            echo "No binary artifact changes; nothing to verify."
            exit 0
          fi

          if echo "$changed" | grep -Eq '^(localPackages/Arti/(Cargo\.(toml|lock)|build-ios\.sh|normalize-archive\.py|arti-bitchat/)|docs/ARTI-BINARY-PROVENANCE\.md)'; then
            echo "Binary change is accompanied by provenance inputs."
            exit 0
          fi

          echo "::error::arti.xcframework changed without matching source, lockfile, build-script, or provenance-doc changes. See docs/ARTI-BINARY-PROVENANCE.md (\"Do not accept an xcframework-only update\")."
          exit 1
