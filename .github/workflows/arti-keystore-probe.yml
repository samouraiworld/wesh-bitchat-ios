name: Arti keystore candidate metadata probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/arti-keystore-probe.yml'
      - 'scripts/probe_arti_keystore_metadata.py'
      - 'scripts/tests/test_arti_keystore_metadata.py'
      - 'localPackages/Arti/arti-bitchat/Cargo.toml'
      - 'localPackages/Arti/arti-bitchat/src/lib.rs'
      - 'localPackages/Arti/Cargo.lock'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch exact baseline source only
        run: git fetch --no-tags --depth=1 origin e9567dff391a2c7c2b8d5ddbd0c41365a5d9403e
      - name: Test synthetic metadata policy failures
        run: python3 -m unittest discover -s scripts/tests -p test_arti_keystore_metadata.py -v
      - name: Install exact existing Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Resolve scratch lock and inspect five target graphs
        env:
          CARGO_HOME: ${{ runner.temp }}/keystore-probe-cargo
        run: |
          python3 scripts/probe_arti_keystore_metadata.py \
            --checkout "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/keystore-probe" \
            --evidence "$RUNNER_TEMP/keystore-probe-evidence"
      - name: Test four real inert keystore cases without Tor bootstrap
        env:
          CARGO_HOME: ${{ runner.temp }}/keystore-probe-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/keystore-probe-host-target
        run: >-
          cargo +1.96.0 test --locked
          --manifest-path "$RUNNER_TEMP/keystore-probe/candidate/localPackages/Arti/Cargo.toml"
          -p arti-bitchat --lib --jobs 2 keystore_policy_tests -- --test-threads=1
      - name: Retain only lock and graph evidence for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-keystore-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/keystore-probe-evidence
          if-no-files-found: error
          retention-days: 14
