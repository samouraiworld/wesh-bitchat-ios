name: Arti keystore candidate A-B

on:
  # This separate candidate producer never replaces the old-binary gate.
  # Apply this label only after reviewing/importing the metadata probe lock.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Reviewed exact candidate source commit (40 lowercase hex)
        required: true
        type: string
      candidate_lock_sha256:
        description: Reviewed imported lock SHA-256 (64 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

jobs:
  select-reviewed-source:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'native-keystore-build-reviewed'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      lock: ${{ steps.source.outputs.lock }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_commit }}
          persist-credentials: false
      - id: source
        env:
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || inputs.candidate_commit }}
          REVIEWED_LOCK: ${{ inputs.candidate_lock_sha256 }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,re,subprocess
          commit=os.environ['REVIEWED_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}',commit)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==commit
          lock=hashlib.sha256(pathlib.Path('localPackages/Arti/Cargo.lock').read_bytes()).hexdigest()
          if os.environ['TRIGGER']=='workflow_dispatch':
              assert re.fullmatch('[0-9a-f]{64}',os.environ['REVIEWED_LOCK'])
              assert lock==os.environ['REVIEWED_LOCK']
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write(f'commit={commit}\nlock={lock}\n')
          PY
      - name: Test candidate comparison contracts
        run: python3 -m unittest discover -s scripts/tests -p test_arti_keystore_candidate.py -v

  build:
    needs: select-reviewed-source
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        copy: [A, B]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.select-reviewed-source.outputs.commit }}
          persist-credentials: false
      - name: Build all five targets with fresh isolated caches
        env:
          REVIEWED_COMMIT: ${{ needs.select-reviewed-source.outputs.commit }}
          REVIEWED_LOCK: ${{ needs.select-reviewed-source.outputs.lock }}
        run: |
          python3 scripts/build_arti_keystore_candidate.py build \
            --checkout "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/keystore-clean" \
            --destination "$RUNNER_TEMP/keystore-candidate" \
            --expected-commit "$REVIEWED_COMMIT" --expected-lock "$REVIEWED_LOCK"
      - name: Retain complete candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-keystore-candidate-${{ matrix.copy }}
          path: ${{ runner.temp }}/keystore-candidate
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: [select-reviewed-source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.select-reviewed-source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ios-keystore-candidate-*
          path: ${{ runner.temp }}/candidate-pair
      - name: Compare all eight files and exact source/tool receipts
        env:
          REVIEWED_COMMIT: ${{ needs.select-reviewed-source.outputs.commit }}
          REVIEWED_LOCK: ${{ needs.select-reviewed-source.outputs.lock }}
        run: |
          python3 scripts/build_arti_keystore_candidate.py compare \
            "$RUNNER_TEMP/candidate-pair/ios-keystore-candidate-A" \
            "$RUNNER_TEMP/candidate-pair/ios-keystore-candidate-B" \
            --report "$RUNNER_TEMP/candidate-comparison.json" \
            --expected-commit "$REVIEWED_COMMIT" --expected-lock "$REVIEWED_LOCK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-keystore-candidate-comparison
          path: ${{ runner.temp }}/candidate-comparison.json
          if-no-files-found: error
          retention-days: 14
