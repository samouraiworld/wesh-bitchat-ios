name: Attribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  attribution:
    name: No published file or PR text carries assistant attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Tracked files (text, binary metadata, base64)
        run: python3 .github/scripts/check-vendor-attribution.py .
      - name: Branch name, pull request title and body
        if: github.event_name == 'pull_request'
        env:
          REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$REF" | python3 .github/scripts/check-vendor-attribution.py --text "branch name"
          printf '%s' "$TITLE" | python3 .github/scripts/check-vendor-attribution.py --text "pull request title"
          printf '%s' "$BODY" | python3 .github/scripts/check-vendor-attribution.py --text "pull request body"
