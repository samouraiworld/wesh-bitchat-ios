name: Arti Independent Clean Rebuild

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comparison-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check synthetic comparison failures
        run: python3 -m unittest discover -s scripts/tests -p test_arti_clean_rebuild.py

  clean-rebuild:
    needs: comparison-contracts
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The runner image's preinstalled rustup drifts with image updates (it
      # changed between the 2026-10-23 and 2026-11-04 xcode-27-arm64 images).
      # Both the verifier and the unchanged build recipe resolve `rustup`
      # through $HOME/.cargo/bin, so the audited bootstrap replaces the image's
      # binary and proxies there: no new directory enters PATH, and the build
      # runs under the same rustup the attestation records. The rebuild itself
      # still uses its own empty CARGO_HOME and RUSTUP_HOME.
      - name: Install the audited rustup bootstrap
        env:
          RUSTUP_VERSION: 1.29.2
          RUSTUP_INIT_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          download="$(mktemp -d "$RUNNER_TEMP/rustup-init.XXXXXX")"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$download/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/aarch64-apple-darwin/rustup-init"
          echo "$RUSTUP_INIT_SHA256  $download/rustup-init" | shasum -a 256 -c -
          chmod 700 "$download/rustup-init"
          CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            "$download/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          rm -- "$download/rustup-init"
          rmdir -- "$download"
          installed="$(command -v rustup)"
          test "$installed" = "$HOME/.cargo/bin/rustup"
          version="$("$installed" --version 2>/dev/null)"
          echo "$version"
          case "$version" in "rustup $RUSTUP_VERSION "*) ;; *) exit 1 ;; esac
          # Every proxy must now be the audited binary, not a leftover.
          for proxy in cargo rustc; do cmp "$HOME/.cargo/bin/$proxy" "$installed"; done
      - name: Rebuild five architectures without restored build caches
        run: |
          set -euo pipefail
          python3 scripts/verify_arti_clean_rebuild.py \
            --checkout "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/arti-clean-rebuild" \
            --report "$RUNNER_TEMP/arti-clean-rebuild-result.json"
      - name: Retain only the successful hash comparison
        uses: actions/upload-artifact@v4
        with:
          name: arti-clean-rebuild-comparison
          path: ${{ runner.temp }}/arti-clean-rebuild-result.json
          if-no-files-found: error
          retention-days: 14
