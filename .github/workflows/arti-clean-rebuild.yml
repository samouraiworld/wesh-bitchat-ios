name: Arti Independent Clean Rebuild

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comparison-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check synthetic comparison failures
        run: python3 -m unittest discover -s scripts/tests -p test_arti_clean_rebuild.py

  clean-rebuild:
    needs: comparison-contracts
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The runner image's preinstalled rustup drifts with image updates (it
      # changed between the 2026-10-23 and 2026-11-04 xcode-27-arm64 images),
      # so the audited bootstrap is installed here from a pinned hash rather
      # than taken from the image. Only the rustup binary comes from this step:
      # the rebuild still uses its own empty CARGO_HOME and RUSTUP_HOME.
      - name: Install the audited rustup bootstrap
        env:
          RUSTUP_VERSION: 1.29.2
          RUSTUP_INIT_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          bootstrap="$RUNNER_TEMP/rustup-bootstrap"
          mkdir -p "$bootstrap"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$bootstrap/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/aarch64-apple-darwin/rustup-init"
          echo "$RUSTUP_INIT_SHA256  $bootstrap/rustup-init" | shasum -a 256 -c -
          chmod +x "$bootstrap/rustup-init"
          CARGO_HOME="$bootstrap/cargo" RUSTUP_HOME="$bootstrap/rustup" \
            "$bootstrap/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          "$bootstrap/cargo/bin/rustup" --version
          echo "$bootstrap/cargo/bin" >> "$GITHUB_PATH"
      - name: Rebuild five architectures without restored build caches
        run: |
          set -euo pipefail
          python3 scripts/verify_arti_clean_rebuild.py \
            --checkout "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/arti-clean-rebuild" \
            --report "$RUNNER_TEMP/arti-clean-rebuild-result.json"
      - name: Retain only the successful hash comparison
        uses: actions/upload-artifact@v4
        with:
          name: arti-clean-rebuild-comparison
          path: ${{ runner.temp }}/arti-clean-rebuild-result.json
          if-no-files-found: error
          retention-days: 14
