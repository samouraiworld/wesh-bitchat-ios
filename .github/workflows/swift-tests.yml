name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bundle-contracts:
    name: Check V1 bundle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check share-extension retirement
        run: python3 -m unittest discover -s scripts/tests -p "test_share_extension_retirement.py" -v
      - name: Check release localization surface
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_check_release_localizations.py" -v
          python3 scripts/check_release_localizations.py .
      - name: Check App Store screenshot contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_store_screenshot_tooling.py" -v
          python3 -m unittest discover -s scripts/tests -p "test_screenshot_capture_boundary.py" -v
          python3 scripts/check_screenshot_capture_boundary.py .
          python3 scripts/validate_store_screenshots.py StoreAssets/iOS/107 \
            --candidate-commit "$(python3 -c 'import json; print(json.load(open("StoreAssets/iOS/107/manifest.json"))["candidateSourceCommit"])')"

  test:
    name: Run Swift Tests (${{ matrix.name }})
    runs-on: macos-latest
    # A hung test must fail fast, not hold a runner for GitHub's 360-minute
    # default (observed: intermittent app-suite hangs starving the queue).
    # The test step carries a tighter bound (5-minute watchdog); this is the
    # backstop.
    timeout-minutes: 25

    strategy:
      fail-fast: false # Don't cancel other matrix jobs when one fails
      matrix:
        include:
          - name: app
            path: .
          - name: BitLogger
            path: localPackages/BitLogger
          - name: BitFoundation
            path: localPackages/BitFoundation
          # TorManager liveness and the SOCKS address-type check; the Rust
          # library is linked from the vendored xcframework, never rebuilt.
          - name: Arti
            path: localPackages/Arti

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Use the Xcode-bundled Swift toolchain: it always matches the SDK on
      # the runner image. A standalone swift.org toolchain (setup-swift) broke
      # whenever the image's Xcode moved ahead of it ("this SDK is not
      # supported by the compiler").
      - name: Note toolchain version (cache key)
        id: swift-version
        run: echo "version=$(swift --version 2>/dev/null | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ matrix.path }}/.build
          key: ${{ runner.os }}-${{ steps.swift-version.outputs.version }}-${{ matrix.name }}-${{ hashFiles(format('{0}/**/*.swift', matrix.path), format('{0}/**/Package.resolved', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.swift-version.outputs.version }}-${{ matrix.name }}-${{ hashFiles(format('{0}/**/Package.resolved', matrix.path)) }}
            ${{ runner.os }}-${{ steps.swift-version.outputs.version }}-${{ matrix.name }}-

      - name: Build tests
        # Built separately so the hang watchdog below times only test
        # execution: a cold-cache coverage build on a slow runner can
        # legitimately take several minutes, and is already bounded by the
        # 15-minute job timeout.
        run: swift build --build-tests --enable-code-coverage --package-path ${{ matrix.path }}

      # SwiftPM copies string catalogs without compiling their localized
      # tables. Exercise the same real strings/stringsdict resources that
      # Xcode produces, including French and plural-formatting lookups.
      - name: Compile app localization resources
        if: matrix.name == 'app'
        run: |
          set -euo pipefail
          BIN_PATH=$(swift build --show-bin-path --package-path .)
          CATALOG="bitchat/Views/Wesh/Pave/Pave.xcstrings"
          test -f "$CATALOG"
          RESOURCE_DIRECTORY=$(python3 - "$BIN_PATH" "$CATALOG" <<'PY'
          import pathlib
          import sys

          bundle = pathlib.Path(sys.argv[1]) / "bitchat_bitchat.bundle"
          if not bundle.is_dir():
              raise SystemExit("Built app module resource bundle is missing")
          catalogs = list(bundle.rglob("Pave.xcstrings"))
          if len(catalogs) != 1 or catalogs[0].read_bytes() != pathlib.Path(sys.argv[2]).read_bytes():
              raise SystemExit("Built app resource catalog does not match its source")
          if catalogs[0].parent not in (bundle, bundle / "Contents" / "Resources"):
              raise SystemExit("Built app catalog is outside a standard bundle resource directory")
          print(catalogs[0].parent)
          PY
          )
          xcrun xcstringstool compile "$CATALOG" --output-directory "$RESOURCE_DIRECTORY" \
            --language en --language fr --format stringsAndStringsdict
          for language in en fr; do
            test -s "$RESOURCE_DIRECTORY/$language.lproj/Pave.strings"
            test -s "$RESOURCE_DIRECTORY/$language.lproj/Pave.stringsdict"
          done

      - name: Run Tests
        # Perf benchmarks are excluded here and run serially in
        # perf-floors.yml: measuring while parallel test processes contend for cores
        # produces noisy numbers, and the XCTest measure machinery has hung
        # intermittently under parallel workers on loaded runners. Excluded
        # via --skip (not just the env guard): every app run since the
        # baselines landed timed out at the 15-minute job limit with the
        # baseline tests dispatched into the parallel phase.
        #
        # The watchdog samples any still-running test processes after 5
        # minutes (the suite passes in seconds when healthy; the build is
        # done by this step) and kills the run, so a hang fails fast with
        # stacks in the log instead of a silent timeout.
        env:
          BITCHAT_SKIP_PERF_BASELINES: "1"
        run: |
          swift test --skip-build --parallel --quiet --enable-code-coverage \
            --skip PerformanceBaselineTests \
            --package-path ${{ matrix.path }} &
          test_pid=$!
          (
            sleep 300
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "::group::Tests still running after 5 minutes — sampling before kill"
              for pid in $(pgrep -if 'swiftpm-testing|xctest|PackageTests' || true); do
                echo "--- sample of pid $pid ---"
                sample "$pid" 5 2>/dev/null || true
              done
              echo "::endgroup::"
              pkill -KILL -P "$test_pid" 2>/dev/null || true
              kill -KILL "$test_pid" 2>/dev/null || true
            fi
          ) &
          watchdog_pid=$!
          wait "$test_pid" && status=0 || status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          exit "$status"

      # Informational only: there is deliberately no percentage threshold, but
      # a broken/missing report is a CI configuration error and must be visible.
      - name: Coverage summary
        run: |
          BIN_PATH=$(swift build --show-bin-path --package-path ${{ matrix.path }})
          PROF="$BIN_PATH/codecov/default.profdata"
          XCTEST=$(find "$BIN_PATH" -maxdepth 1 -name '*.xctest' | head -1)
          BINARY="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
          if [ ! -f "$PROF" ] || [ ! -f "$BINARY" ]; then
            echo "::error::Coverage profile or test binary is missing"
            exit 1
          fi
          xcrun llvm-cov report "$BINARY" -instr-profile "$PROF" \
            -ignore-filename-regex='(Tests|\.build|checkouts|Mocks|_PreviewHelpers)'

      # Benchmarks and their floor gate run in perf-floors.yml, outside the
      # required checks, so runner variance never blocks a merge.

  # SPM tests do not link the shipping app targets. This job covers the
  # iOS-conditional paths and both universal Release link configurations.
  ios-build:
    name: Build Release apps (universal)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check clean recipe safety
        run: bash scripts/check-just-clean-safety.sh

      # BITCHAT_DEV_ALLOW_CLEARNET compiles Tor enforcement out. Checked in
      # the sources (xcconfigs, Release configurations, package manifests)
      # and in the build settings Release actually resolves to.
      - name: Release builds keep Tor enforced
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/tests -p "test_check_release_tor_enforced.py" -v
          for scheme in "bitchat (iOS)" "bitchat (macOS)"; do
            xcodebuild -project bitchat.xcodeproj -scheme "$scheme" \
              -configuration Release -showBuildSettings
          done | python3 scripts/check_release_tor_enforced.py . --build-settings -

      - name: Build iOS (simulator, no signing)
        # Build both simulator architectures so CI validates every vendored
        # Arti simulator slice and the configuration that ships.
        run: |
          set -o pipefail
          xcodebuild -project bitchat.xcodeproj \
            -scheme "bitchat (iOS)" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-release-derived" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check built iOS localization surface
        run: |
          products="$RUNNER_TEMP/ios-release-derived/Build/Products/Release-iphonesimulator"
          app_count=$(find "$products" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')
          if [ "$app_count" -ne 1 ]; then
            echo "::error::Expected exactly one built iOS app, found $app_count"
            exit 1
          fi
          app=$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)
          python3 scripts/check_release_localizations.py . --product "$app"

      - name: Build isolated screenshot renderer
        run: |
          set -o pipefail
          xcodebuild -project bitchat.xcodeproj \
            -scheme "Wesh Store Screenshots" \
            -configuration Screenshot \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-screenshot-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prove screenshot fixtures are excluded from Release
        run: |
          release_app=$(find "$RUNNER_TEMP/ios-release-derived/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          screenshot_app=$(find "$RUNNER_TEMP/ios-screenshot-derived/Build/Products/Screenshot-iphonesimulator" \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$release_app"
          test -n "$screenshot_app"
          python3 scripts/check_screenshot_capture_boundary.py . \
            --release-product "$release_app" \
            --screenshot-product "$screenshot_app"

      - name: Build macOS (universal, no signing)
        run: |
          set -o pipefail
          xcodebuild -project bitchat.xcodeproj \
            -scheme "bitchat (macOS)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # The SwiftPM matrix runs on macOS and cannot execute UIKit/CoreBluetooth
  # conditional tests. Build the shared iOS test target and run it on the first
  # available iPhone simulator from the runner image instead of hard-coding a
  # model that changes when GitHub updates Xcode. The suite intentionally runs
  # in one test runner: a number of integration tests exercise process-global
  # stores and notification centers, so overlapping workers can corrupt each
  # other's fixtures and turn sub-second tests into multi-minute timeouts.
  ios-tests:
    name: Run iOS simulator tests
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Some runner images list only placeholder destinations (rows carrying
      # "error:" or "unavailable") or ship the selected Xcode without a
      # matching iOS simulator runtime, so this walks three paths in order:
      # a usable xcodebuild destination, an existing simctl device, and
      # finally creating a device from the newest installed iOS runtime.
      - name: Select available iPhone simulator
        id: destination
        run: |
          set -uo pipefail
          destinations=$(xcodebuild -project bitchat.xcodeproj -scheme "bitchat (iOS)" -showdestinations 2>/dev/null || true)
          destination_id=$(awk -F'id:' '
            /platform:iOS Simulator/ && /name:iPhone/ \
              && !/error/ && !/unavailable/ && !found {
              value=$2
              sub(/,.*/, "", value)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              print value
              found=1
            }
          ' <<< "$destinations")

          if [ -n "$destination_id" ]; then
            echo "Selected destination via xcodebuild -showdestinations: $destination_id"
          else
            echo "No usable iPhone destination in -showdestinations output; falling back to simctl"
            destination_id=$(xcrun simctl list devices available --json | jq -r '
              [.devices | to_entries[]
                | select(.key | contains("iOS"))
                | .value[]
                | select(.isAvailable and (.name | startswith("iPhone")))]
              | first.udid // empty')
            if [ -n "$destination_id" ]; then
              echo "Selected existing simctl device: $destination_id"
            else
              echo "No available iPhone simulator device; creating one"
              # Newest installed iOS runtime plus an iPhone device type that
              # runtime itself reports as supported, so the pair always match.
              create_spec=$(xcrun simctl list runtimes --json | jq -r '
                [.runtimes[] | select(.platform == "iOS" and .isAvailable)]
                | sort_by(.version | split(".") | map(tonumber))
                | last // empty
                | .identifier as $runtime
                | ([(.supportedDeviceTypes // [])[]
                    | select(.productFamily == "iPhone"
                        or (.name // "" | startswith("iPhone")))]
                  | first.identifier // empty) as $devicetype
                | "\($devicetype) \($runtime)"')
              read -r devicetype runtime <<< "$create_spec" || true
              if [ -z "${devicetype:-}" ] || [ -z "${runtime:-}" ]; then
                echo "::error::No iPhone simulator destination found and none creatable (no installed iOS runtime with an iPhone device type)"
                exit 1
              fi
              destination_id=$(xcrun simctl create ci-iphone "$devicetype" "$runtime") || {
                echo "::error::simctl create failed for $devicetype on $runtime"
                exit 1
              }
              echo "Created simulator $destination_id ($devicetype, $runtime)"
            fi
          fi

          echo "Using iPhone simulator destination id: $destination_id"
          echo "id=$destination_id" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        run: |
          set -o pipefail
          xcodebuild -project bitchat.xcodeproj \
            -scheme "bitchat (iOS)" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.destination.outputs.id }}" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

  # Blocking since the backlog reached zero (all violations fixed; rules the
  # codebase deliberately breaks are disabled in .swiftlint.yml). --strict
  # promotes warnings to errors so new violations fail the job. Runs in a
  # pinned container (no Xcode plugin, no pbxproj changes) so it can never
  # break the documented xcodebuild path.
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job runs a third-party container image, so give it the least
    # privilege we can: a read-only token, and no credentials left in the
    # checkout for the container to find.
    permissions:
      contents: read
    container:
      # Tag for readability, digest for immutability (tags can be repointed).
      # Bump both together, deliberately — never a floating tag.
      image: ghcr.io/realm/swiftlint:0.65.0@sha256:a482729f4b58741875af1566f23397f3f6db300372756fc31606d0a4527fab9e
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
